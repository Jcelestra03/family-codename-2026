<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbf6ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171212" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>">
<title>Secret Santa</title>
<style>
:root{--bg:#fbf6ef;--card:#fff;--ink:#2a1f1f;--mute:#7a6a68;--red:#c0392b;--green:#1f6b4a;--line:#e8dccd;--glass:rgba(255,255,255,.72)}
@media (prefers-color-scheme:dark){:root{--bg:#171212;--card:#221a1a;--ink:#f6ece8;--mute:#b3a29e;--red:#ef6a5b;--green:#5fc79a;--line:#3a2d2c;--glass:rgba(34,26,26,.72)}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:28px;margin:8px 0 16px}h1 span{color:var(--red)}h3{margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input[type=text],input[type=date],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px}
select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:var(--red);color:#fff;width:100%;margin-top:14px}
button.alt{background:transparent;color:var(--green);border:1px solid var(--green)}
button.sm{width:auto;margin:0;padding:6px 12px;font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tabs button{margin:0;flex:1 1 auto;background:transparent;color:var(--mute);border:1px solid var(--line);padding:10px 4px;font-size:14px}
.tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{border:1px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:15px;user-select:none}
.opts label:has(input:checked){background:var(--green);color:#fff;border-color:var(--green)}
.opts input{display:none}
.oth{margin-top:8px}
.meta{color:var(--mute);font-size:14px}.err{color:var(--red);font-weight:600;margin-top:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.big{font-size:32px;font-weight:800;color:var(--green);margin:4px 0}
code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
html{-webkit-text-size-adjust:100%;color-scheme:light dark}
body{-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
main{padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
button{min-height:44px;touch-action:manipulation}
button.sm{min-height:40px;padding:8px 14px}
input[type=text],input[type=date],textarea,select{font-size:16px;min-height:44px}
textarea{min-height:90px}
.opts label{padding:10px 14px;font-size:16px}
.big{font-size:clamp(26px,9vw,36px)}
.item button{flex-shrink:0}
.tabs button{width:auto}
#fab,#menu,#scrim{display:none}
@media (max-width:640px){
  .tabs{display:none}
  main{padding:18px 12px calc(48px + env(safe-area-inset-bottom,0px))}
  main:has(#fab) h1{display:flex;align-items:center;min-height:44px;margin:0 0 16px;padding-left:56px}
  #fab{display:flex;align-items:center;justify-content:center;position:fixed;z-index:22;left:calc(12px + env(safe-area-inset-left,0px));top:calc(18px + env(safe-area-inset-top,0px));width:44px;height:44px;margin:0;padding:0;border-radius:50%;font-size:20px;background:var(--glass);color:var(--ink);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
  #scrim.open{display:block;position:fixed;inset:0;z-index:20}
  #menu.open{display:block;position:fixed;z-index:21;left:calc(12px + env(safe-area-inset-left,0px));top:calc(70px + env(safe-area-inset-top,0px));width:min(240px,80vw);padding:8px;border-radius:16px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
  #menu button{display:block;width:100%;margin:0;text-align:left;background:transparent;color:var(--ink);border-radius:10px;padding:12px 14px;font-size:16px}
  #menu button.on{background:rgba(31,107,74,.35)}
}
body::before{content:"";position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:14px;z-index:30;pointer-events:none;background:radial-gradient(circle at 10px 7px,#e74c3c 4px,transparent 5px) 0 0/72px 14px,radial-gradient(circle at 34px 7px,#f1c40f 4px,transparent 5px) 0 0/72px 14px,radial-gradient(circle at 58px 7px,#2ecc71 4px,transparent 5px) 0 0/72px 14px;animation:twinkle 1.6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:1}to{opacity:.45}}
.card{position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:repeating-linear-gradient(135deg,var(--red) 0 8px,#fff 8px 16px)}
.snow{position:fixed;top:-5vh;z-index:15;color:#a9cdee;pointer-events:none;user-select:none;animation:fall linear infinite;text-shadow:0 0 4px rgba(120,160,200,.6)}
@keyframes fall{to{transform:translateY(110vh) translateX(30px)}}
@media (prefers-reduced-motion:reduce){.snow,body::before{display:none}}
footer{text-align:center;color:var(--mute);margin-top:24px;font-size:14px}
.poke{display:block;margin:6px auto;object-fit:contain;flex-shrink:0}
#ad{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.adbox{position:relative;width:min(380px,100%);max-height:92vh;overflow:auto;background:var(--card);color:var(--ink);border:3px solid var(--red);border-radius:18px;padding:22px 16px 16px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.adx{position:absolute;top:8px;right:8px;width:36px;height:36px;min-height:36px;margin:0;padding:0;border-radius:50%;background:var(--glass);color:var(--ink);border:1px solid var(--line);font-size:16px}
.adtag{font-size:12px;color:var(--mute);letter-spacing:.04em;margin-bottom:4px}
.adbox h2{margin:0 0 12px;font-size:22px}
.adpics{display:flex;gap:12px;justify-content:center}.adpic{flex:1;max-width:150px}
.adimg{position:relative;width:100%;aspect-ratio:1;border-radius:14px;background:var(--bg);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:52px}
.adimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.adchk{display:flex;gap:12px;align-items:flex-start;text-align:left;margin-top:14px;padding:12px;border:2px dashed var(--green);border-radius:12px;font-weight:600;cursor:pointer}
.adchk input{width:26px;height:26px;flex-shrink:0;accent-color:var(--green)}
.adthx{min-height:22px;margin-top:8px;color:var(--green);font-weight:700}
.toasts{position:fixed;left:0;right:0;top:calc(70px + env(safe-area-inset-top,0px));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:10px 16px;border-radius:14px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:92vw;text-align:center}
</style>
</head>
<body>
<main>
<h1>🎄 Secret <span>Santa</span> 🎁</h1>
<div id="app"></div>
<footer>🎄 ❄️ Merry Christmas! ❄️ 🎅</footer>
</main>
<script type="module">
// ===== PASTE YOUR FIREBASE CONFIG HERE =====
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD_88nv3AFJnIA9hOnTjnH3fC8xZIj71Ts",
  authDomain: "secret-santa-48a49.firebaseapp.com",
  projectId: "secret-santa-48a49",
  storageBucket: "secret-santa-48a49.firebasestorage.app",
  messagingSenderId: "517975682644",
  appId: "1:517975682644:web:742616126c97459a7987c1"
};
// ===========================================
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,getDocs,collection,writeBatch,setDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const mkcode=()=>Array.from({length:6},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*31)]).join('');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pairKey=(a,b)=>[a,b].map(x=>x.toLowerCase()).sort().join('|');
let db,ev,me,people=[];

// Couples who must NOT draw each other. Fill in later, e.g. ["Mom","Dad"],
const COUPLES=[
  ["Kayla","Bryann"],
  ["Mariebel","Gerry Celestra"],
  ["Margerie","Carson"],
  ["Filipe","Kristy"],
  ["Germaine","Andrea"],
];
// Code names handed out when someone finishes their questionnaire. Each needs its Pokedex number (for the picture). REPLACE with your picks.
const DEX={"Pikachu":25,"Eevee":133,"Bulbasaur":1,"Charmander":4,"Squirtle":7,"Jigglypuff":39,"Snorlax":143,"Psyduck":54,"Mew":151,"Togepi":175,"Meowth":52,"Gengar":94};
const POKEMON=Object.keys(DEX);

const Q=[
 {id:'cats',t:'What kinds of gifts do you enjoy?',o:['Books','Tech & gadgets','Clothing & accessories','Games & puzzles','Cozy home stuff','Beauty & self-care','Outdoors & sports','Art & crafts','Experiences']},
 {id:'treats',t:'Favorite treats?',o:['Chocolate','Coffee or tea','Candy','Baked goods','Savory snacks','Spicy foods']},
 {id:'hobbies',t:'Your hobbies?',o:['Gaming','Reading','Cooking','Music','Fitness','Travel','Movies & TV','Crafts / DIY']},
 {id:'colors',t:'Favorite colors?',o:['Red','Blue','Green','Black','Pink','Purple','Neutrals']},
 {id:'avoid',t:'Gifts you would rather NOT get?',o:['Candles','Socks','Mugs','Gift cards','Food','Clothing']}
];

async function boot(){
  if(!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey.startsWith('PASTE')){
    app.innerHTML='<div class="card"><h3>Almost there</h3><p class="meta">Paste your Firebase config at the top of the script in index.html, then reload.</p></div>';return}
  try{const fb=initializeApp(FIREBASE_CONFIG);await signInAnonymously(getAuth(fb));db=getFirestore(fb);const s=await getDoc(doc(db,'event','main'));ev=s.exists()?s.data():null}
  catch(e){app.innerHTML='<div class="card err">Could not reach the database. Check your Firebase config, Firestore rules, and that Anonymous sign-in is enabled.</div>';return}
  if(!ev)return showCreate();
  const c=ls.get('santa-code');
  if(c&&await login(c,true))return;
  showLogin();
}

function showCreate(){
  app.innerHTML=`<div class="card"><h3>Set up your Secret Santa</h3>
  <label class="f">Event name</label><input type="text" id="title" value="Family Secret Santa">
  <label class="f">Recommended budget</label><input type="text" id="budget" value="$30">
  <label class="f">Gift due date</label><input type="date" id="date">
  <label class="f">Your name (you'll be the organizer)</label><input type="text" id="org" value="Jem">
  <label class="f">Everyone else's names (one per line)</label><textarea id="names" style="min-height:200px">Kayla
Bryann
Mariebel
Gerry Celestra
Margerie
Carson
Filipe
Kristy
Germaine
Andrea</textarea>
  <button id="go">🎄 Create event &amp; codes</button><div class="err" id="err"></div></div>`;
  $('#go').onclick=create;
}

async function create(){
  const org=$('#org').value.trim();
  const others=[...new Set($('#names').value.split('\n').map(s=>s.trim()).filter(s=>s&&s!==org))];
  if(!org||others.length<2){$('#err').textContent='Add your name and at least 2 other people.';return}
  const e={title:$('#title').value.trim()||'Secret Santa',budget:$('#budget').value.trim(),date:$('#date').value.trim(),drawn:false,revealed:false};
  const b=writeBatch(db);b.set(doc(db,'event','main'),e);
  const used=new Set();let first;
  [org,...others].forEach((n,i)=>{let c;do{c=mkcode()}while(used.has(c));used.add(c);if(i===0)first=c;
    b.set(doc(db,'people',c),{name:n,admin:i===0,claimed:i===0,done:false,bought:false,kindness:null,answers:null,codename:null,giveTo:null})});
  try{await b.commit();ev=e;showCode(first)}catch(x){$('#err').textContent='Could not save. Check your Firestore rules.'}
}

function showLogin(){
  app.innerHTML=`<div class="card"><h3>${esc(ev.title)}</h3><p class="meta">Enter your personal code to log in.</p>
  <input type="text" id="code" placeholder="Your code" autocapitalize="characters" autocomplete="off">
  <button id="go">🔑 Log in</button><div class="err" id="err"></div></div>
  <div class="card"><h3>First time here, or forgot your code?</h3><p class="meta">Pick your name to get your code. If you forgot yours, ask the organizer to reset your login first, then pick your name here. Your wishlist and match stay as they are.</p>
  <button class="alt" id="claim">🎅 Pick my name</button></div>`;
  $('#go').onclick=()=>login($('#code').value);
  $('#claim').onclick=showClaim;
}

async function showClaim(){
  let open=[];
  try{open=(await getDocs(collection(db,'people'))).docs.filter(d=>!d.data().claimed).map(d=>({code:d.id,name:d.data().name}))}
  catch(e){app.innerHTML='<div class="card err">Connection problem. Reload and try again.</div>';return}
  open.sort((a,b)=>a.name.localeCompare(b.name));
  app.innerHTML=`<div class="card"><h3>Which one is you?</h3>`+(open.length?
    `<select id="who">${open.map(p=>`<option value="${p.code}">${esc(p.name)}</option>`).join('')}</select>
     <button id="go">✅ That's me</button>`:'<p class="meta">Everyone has already joined. Use your code to log in. If you forgot yours, ask the organizer to reset your login.</p>')+
    `<button class="alt" id="back">⬅️ Back</button><div class="err" id="err"></div></div>`;
  $('#back').onclick=showLogin;
  if(open.length)$('#go').onclick=async()=>{
    const code=$('#who').value,name=$('#who').selectedOptions[0].textContent;
    if(!confirm(`Are you ${name}? You can't change this later.`))return;
    try{const s=await getDoc(doc(db,'people',code));
      if(s.data().claimed){$('#err').textContent='Someone just took that name. Reload and try again.';return}
      const b=writeBatch(db);b.update(doc(db,'people',code),{claimed:true});await b.commit();showCode(code)}
    catch(e){$('#err').textContent='Could not save. Try again.'}};
}

function showCode(code){
  app.innerHTML=`<div class="card" style="text-align:center"><div class="meta">Your personal code</div><div class="big">${code}</div>
  <p class="meta">Write it down or screenshot it. You'll use it to log in on other devices. Keep it private!</p>
  <button id="go">➡️ Continue</button></div>`;
  $('#go').onclick=()=>login(code,true);
}

async function login(code,silent){
  code=code.trim().toUpperCase();
  try{
    const s=await getDoc(doc(db,'people',code));
    if(!s.exists()){if(!silent&&$('#err'))$('#err').textContent="That code didn't work.";return false}
    me={...s.data(),code};ls.set('santa-code',code);
    me.done?home():questionnaire();return true;
  }catch(e){if($('#err'))$('#err').textContent='Connection problem. Try again.';return false}
}

function questionnaire(t=app){
  const a=me.answers||{};
  const sz=a.sizes||{cat:'',v:{},o:{}};
  const sizeCard=`<div class="card"><h3>Clothing sizes (US)</h3><p class="meta" style="margin:0 0 8px">Optional. Pick a sizing style, then your sizes.</p>
  <div class="opts">${Object.entries(CATL).map(([k,l])=>`<label><input type="radio" name="szcat" value="${k}" ${sz.cat===k?'checked':''}>${l}</label>`).join('')}</div><div id="szbox"></div></div>`;
  const qs=Q.map(q=>{const cur=a[q.id]||{sel:[],other:''};
    return `<div class="card"><h3>${q.t}</h3><div class="opts">`+
      q.o.map(o=>`<label><input type="checkbox" name="${q.id}" value="${esc(o)}" ${cur.sel.includes(o)?'checked':''}>${esc(o)}</label>`).join('')+
      `<label><input type="checkbox" class="oc" data-q="${q.id}" ${cur.other?'checked':''}>Other</label></div>
      <input type="text" class="oth" id="o-${q.id}" placeholder="Something else?" value="${esc(cur.other)}" style="${cur.other?'':'display:none'}"></div>`}).join('');
  t.innerHTML=`<p>Hi <b>${esc(me.name)}</b>! Tell your Santa what you'd like. This becomes your wishlist.</p>${qs}${sizeCard}
  <div class="card"><h3>Anything else?</h3><textarea id="notes" placeholder="Sizes, favorite brands, a specific item...">${esc(a.notes||'')}</textarea></div>
  <button id="save">💾 Save my wishlist</button><div class="err" id="err"></div>`;
  document.querySelectorAll('.oc').forEach(c=>c.onchange=()=>{const t=$('#o-'+c.dataset.q);t.style.display=c.checked?'':'none';if(c.checked)t.focus()});
  renderSizes(sz.cat,sz);document.querySelectorAll('input[name=szcat]').forEach(r=>r.onchange=()=>renderSizes(r.value,collectSizes()));
  $('#save').onclick=saveAnswers;
}

async function saveAnswers(){
  const ans={};
  Q.forEach(q=>{ans[q.id]={sel:[...document.querySelectorAll(`input[name="${q.id}"]:checked`)].map(i=>i.value),
    other:document.querySelector(`.oc[data-q="${q.id}"]`).checked?$('#o-'+q.id).value.trim():''}});
  ans.notes=$('#notes').value.trim();ans.sizes=collectSizes();
  try{
    let cn=me.codename;
    if(!cn){
      const all=(await getDocs(collection(db,'people'))).docs.map(d=>d.data());
      const used=new Set(all.map(p=>p.codename).filter(Boolean));
      const free=POKEMON.filter(p=>!used.has(p));
      cn=free.length?free[Math.floor(Math.random()*free.length)]:'Santa #'+(used.size+1);
    }
    const b=writeBatch(db);b.update(doc(db,'people',me.code),{answers:ans,done:true,codename:cn});await b.commit();
    me.answers=ans;me.done=true;me.codename=cn;home();
  }catch(e){$('#err').textContent='Could not save. Try again.'}
}

const L=['XS','S','M','L','XL','2XL','3XL'];
const rng=(a,b,st)=>{const r=[];for(let x=a;x<=b+1e-9;x+=st)r.push(String(x));return r};
const SZ={men:{shirt:L,pants:rng(28,44,2),shoes:rng(6,15,.5),jacket:L},
  women:{shirt:L,pants:rng(0,20,2),shoes:rng(5,12,.5),jacket:L},
  unisex:{shirt:L,pants:L,shoes:rng(5,14,.5),jacket:L}};
const SZL={shirt:'Shirt / top',pants:'Pants',shoes:'Shoes',jacket:'Hoodie / jacket'};
const CATL={men:"Men's",women:"Women's",unisex:'Unisex'};
function renderSizes(cat,cur){
  const box=$('#szbox');if(!cat){box.innerHTML='';return}
  box.innerHTML=Object.keys(SZL).map(k=>{const v=(cur.v||{})[k]||'';
    const hint=k==='pants'?(cat==='men'?' (waist, inches)':cat==='women'?' (US size)':' (letter size)'):k==='shoes'?' (US)':'';
    return `<label class="f">${SZL[k]}${hint}</label><select id="sz-${k}"><option value="">Skip</option>${SZ[cat][k].map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}<option value="__o" ${v==='__o'?'selected':''}>Other</option></select>
    <input type="text" class="oth" id="szo-${k}" placeholder="Your size" value="${esc((cur.o||{})[k]||'')}" style="${v==='__o'?'':'display:none'}">`}).join('');
  Object.keys(SZL).forEach(k=>$('#sz-'+k).onchange=e=>{$('#szo-'+k).style.display=e.target.value==='__o'?'':'none'});
}
function collectSizes(){
  const cat=(document.querySelector('input[name=szcat]:checked')||{}).value||'',v={},o={};
  if(cat)Object.keys(SZL).forEach(k=>{const el=$('#sz-'+k);if(!el||!el.value)return;v[k]=el.value;if(el.value==='__o')o[k]=$('#szo-'+k).value.trim()});
  return {cat,v,o};
}
function sizesHTML(z){
  if(!z||!z.cat)return '';
  const bits=Object.keys(SZL).map(k=>{let x=(z.v||{})[k];if(x==='__o')x=(z.o||{})[k];return x?`${SZL[k]}: ${esc(x)}`:''}).filter(Boolean);
  return bits.length?`<p style="margin:6px 0"><b>Sizes (${CATL[z.cat]}, US)</b><br>${bits.join(' · ')}</p>`:'';
}
function wishHTML(a){
  if(!a)return '<p class="meta">Nothing yet.</p>';
  const parts=Q.map(q=>{const c=a[q.id]||{sel:[],other:''};const l=[...c.sel,...(c.other?[c.other]:[])];
    return l.length?`<p style="margin:6px 0"><b>${q.t.replace(/\?$/,'')}</b><br>${l.map(esc).join(', ')}</p>`:''}).join('');
  return parts+sizesHTML(a.sizes)+(a.notes?`<p style="margin:6px 0"><b>Notes</b><br>${esc(a.notes)}</p>`:'')||'<p class="meta">Nothing yet.</p>';
}

let timer,match=null;
const isRevealed=()=>{const d=dueOf(ev.date);return !!(ev.revealed||(d&&new Date()>=d))};
const dueOf=d=>{const x=d?new Date(d+'T00:00:00'):null;return x&&!isNaN(x)?x:null};
async function home(tab='home',fresh=true){
  clearInterval(timer);window.scrollTo(0,0);
  if(fresh){
    try{ev=(await getDoc(doc(db,'event','main'))).data();me={...(await getDoc(doc(db,'people',me.code))).data(),code:me.code}}catch(e){}
    match=null;
    if(ev.drawn&&me.giveTo){try{match=(await getDoc(doc(db,'people',me.giveTo))).data()}catch(e){}}
  }
  const tabs=[['home','🏠 Home'],...(match?[['match','🎁 My Match'],['msgs','💬 Messages']]:[]),['mine','📝 Answers'],...(match&&isRevealed()?[['reveal','🎉 Reveal']]:[]),...(me.admin?[['org','👑 Organizer']]:[])];
  const tb=tabs.map(([k,l])=>`<button data-t="${k}" class="${k===tab?'on':''}">${l}</button>`).join('');
  app.innerHTML=`<button id="fab" aria-label="Menu">☰</button><div id="scrim"></div><div id="menu">${tb}</div><div class="tabs">${tb}</div><div id="content"></div><button class="alt" id="out">🚪 Log out</button>`;
  document.querySelectorAll('.tabs button,#menu button').forEach(x=>x.onclick=()=>home(x.dataset.t,false));
  const fab=$('#fab'),toggle=o=>{$('#menu').classList.toggle('open',o);$('#scrim').classList.toggle('open',o);fab.textContent=o?'✕':'☰'};
  fab.onclick=()=>toggle(!$('#menu').classList.contains('open'));
  $('#scrim').onclick=()=>toggle(false);
  if(me.admin)watchKind();
  $('#out').onclick=()=>{if(unsub){unsub();unsub=null;known=null}ls.del('santa-code');me=null;showLogin()};
  const c=$('#content');
  if(tab==='mine')return questionnaire(c);
  if(tab==='org')return adminPanel();
  if(tab==='msgs'&&match)return messagesTab(c);
  if(tab==='reveal'&&match&&isRevealed())return revealTab(c);
  if(tab==='match'&&match){
    c.innerHTML=`<div class="card" style="text-align:center"><div class="meta">You're buying for</div>${match.codename?pokeImg(match.codename,140):''}<div class="big">${esc(match.codename||'???')}</div>${match.codename?'':'<div class="meta">Their code name shows up once they finish their wishlist.</div>'}</div>
    <div class="card"><h3>Their wishlist</h3>${match.done?wishHTML(match.answers):'<p class="meta">They haven\'t filled it out yet. Check back soon.</p>'}</div>`;return}
  const due=dueOf(ev.date);const kst=me.kindness==='yes'?'You said yes. Thank you! 💝':me.kindness==='no'?'You passed. No pressure!':'Not answered yet.';
  c.innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div style="flex:1">Hi <b>${esc(me.name)}</b> 👋${me.codename?`<br><span class="meta">Your code name: <b>${esc(me.codename)}</b></span>`:''}</div>${me.codename?pokeImg(me.codename,72):''}</div>
  <div class="card" style="text-align:center"><div class="meta">${esc(ev.title)}</div>${due?`<div class="meta">Gifts due ${esc(due.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}))}</div><div class="big" id="cd"></div>`:(ev.date?`<div class="big">${esc(ev.date)}</div>`:'')}</div>
  <div class="card" style="text-align:center"><div class="meta">Recommended budget</div><div class="big">${esc(ev.budget||'$30')}</div></div>
  ${match?`<div class="card"><label style="display:flex;gap:12px;align-items:center;font-weight:600;cursor:pointer"><input type="checkbox" id="bought" ${me.bought?'checked':''} style="width:24px;height:24px;flex-shrink:0">I've bought my gift</label><p class="meta" style="margin:8px 0 0">The organizer only sees how many people are done, never who.</p></div>`:''}
  <div class="card"><p style="margin:0">${match?"Your match is ready! Open <b>My Match</b> to see who you're buying for.":"Names haven't been drawn yet. Check back soon! 🎄"}</p></div>
  <div class="card" style="text-align:center"><h3>💝 Mochi &amp; Venus</h3><div class="meta" id="kst">${kst}</div><button class="sm alt" id="adopen" style="margin-top:10px">🐶 Open</button></div>
  <div class="card"><h3>Your login code</h3><div id="mycode" class="meta">Hidden for privacy.</div><button class="sm alt" id="showcode" style="margin-top:10px">👀 Show my code</button></div>`;
  $('#adopen').onclick=()=>showAd();if(me.kindness==null)setTimeout(showAd,400);
  const sc=$('#showcode');if(sc)sc.onclick=()=>{const hid=sc.dataset.s==='1';$('#mycode').innerHTML=hid?'Hidden for privacy.':`<code style="font-size:20px">${esc(me.code)}</code>`;sc.dataset.s=hid?'':'1';sc.textContent=hid?'👀 Show my code':'🙈 Hide'};
  const bx=$('#bought');if(bx)bx.onchange=async()=>{try{const b=writeBatch(db);b.update(doc(db,'people',me.code),{bought:bx.checked});await b.commit();me.bought=bx.checked}catch(e){bx.checked=!bx.checked}};
  if(due){const tick=()=>{let ms=due-new Date();const el=$('#cd');if(!el)return;
    if(ms<=0){el.textContent='Gift day! 🎉';return}
    const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
    el.textContent=`${d}d ${h}h ${m}m`};tick();timer=setInterval(tick,30000)}
}

async function messagesTab(c){
  c.innerHTML='<p class="meta">Loading...</p>';
  let asked=[],got=[];
  try{const [g,r]=await Promise.all([getDoc(doc(db,'chats',me.giveTo)),getDoc(doc(db,'chats',me.code))]);
    asked=(g.exists()&&g.data().items)||[];got=(r.exists()&&r.data().items)||[]}
  catch(e){c.innerHTML='<div class="card err">Could not load messages.</div>';return}
  const who=esc(match.codename||'Your match'),left=2-asked.length;
  c.innerHTML=`<div class="card"><h3>Ask ${who}</h3><p class="meta" style="margin:0 0 8px">You can ask 2 questions. They won't know who you are.</p>
  ${asked.map(i=>`<div style="margin:8px 0"><b>You:</b> ${esc(i.q)}<br><b>${who}:</b> ${i.a?esc(i.a):'<span class="meta">Waiting for an answer...</span>'}</div>`).join('')}
  ${left>0?`<textarea id="q" maxlength="300" placeholder="Your question..." style="min-height:70px"></textarea><button id="ask">💬 Send question (${left} left)</button>`:'<p class="meta">You\'ve used both questions.</p>'}<div class="err" id="merr"></div></div>
  <div class="card"><h3>From your Santa</h3>${got.length?got.map((i,n)=>`<div style="margin:8px 0"><b>Your Santa:</b> ${esc(i.q)}<br>${i.a?`<b>You:</b> ${esc(i.a)}`:`<textarea id="a${n}" maxlength="300" placeholder="Your answer..." style="min-height:60px"></textarea><button class="sm" data-a="${n}">📨 Send answer</button>`}</div>`).join(''):'<p class="meta">No questions yet. Check back later.</p>'}</div>`;
  const save=async(id,items)=>{try{await setDoc(doc(db,'chats',id),{items});messagesTab(c)}catch(e){$('#merr').textContent='Could not send. Try again.'}};
  const ask=$('#ask');if(ask)ask.onclick=()=>{const q=$('#q').value.trim();if(q)save(me.giveTo,[...asked,{q,a:null}])};
  c.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{const n=+x.dataset.a,v=$('#a'+n).value.trim();if(!v)return;save(me.code,got.map((y,k)=>k===n?{...y,a:v}:y))});
}

async function revealTab(c){
  c.innerHTML='<p class="meta">Loading...</p>';
  let all=[];
  try{all=(await getDocs(collection(db,'people'))).docs.map(d=>({code:d.id,...d.data()}))}
  catch(e){c.innerHTML='<div class="card err">Could not load the reveal.</div>';return}
  const santa=all.find(p=>p.giveTo===me.code),to=all.find(p=>p.code===me.giveTo);
  const box=(l,p)=>`<div class="card" style="text-align:center"><div class="meta">${l}</div><div class="big">${esc(p?p.name:'???')}</div>${p&&p.codename?`${pokeImg(p.codename,80)}<div class="meta">a.k.a. ${esc(p.codename)}</div>`:''}</div>`;
  c.innerHTML=`<p style="text-align:center">🎉 It's reveal time!</p>${box('Your Secret Santa was',santa)}${box('You bought for',to)}`;
}

const pokeImg=(n,px=64)=>DEX[n]?`<img class="poke" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${DEX[n]}.png" alt="${esc(n)}" width="${px}" height="${px}" loading="lazy" onerror="this.remove()">`:'';
for(let i=0;i<22;i++){const f=document.createElement('i');f.className='snow';f.textContent='❄';
  f.style.cssText=`left:${Math.random()*100}vw;font-size:${8+Math.random()*10}px;opacity:${.4+Math.random()*.5};animation-duration:${9+Math.random()*10}s;animation-delay:-${Math.random()*15}s`;document.body.append(f)}

async function setKind(v){
  try{const b=writeBatch(db);b.update(doc(db,'people',me.code),{kindness:v});await b.commit();me.kindness=v;
    const k=$('#kst');if(k)k.textContent=v==='yes'?'You said yes. Thank you! 💝':'You passed. No pressure!';return true}
  catch(e){const t=$('#adthx');if(t)t.textContent='Could not save. Try again.';return false}
}
function showAd(){
  if($('#ad'))return;
  const pic=(src,emoji,name)=>`<div class="adpic"><div class="adimg"><span>${emoji}</span><img src="${src}" alt="${name}" onerror="this.remove()"></div><b>${name}</b></div>`;
  const ad=document.createElement('div');ad.id='ad';
  ad.innerHTML=`<div class="adbox"><button class="adx" aria-label="Close">✕</button><div class="adtag">🎅 Sponsored by Santa</div><h2>🎁 Gift Mochi &amp; Venus?</h2>
  <div class="adpics">${pic('mochi.jpg','🐶','Mochi')}${pic('venus.jpg','👶','Venus')}</div>
  <p>Mochi and Venus would love a little something under the tree this year. Totally optional, no pressure!</p>
  <label class="adchk"><input type="checkbox" id="adc" ${me.kindness==='yes'?'checked':''}><span>I'd like to gift them out of the kindness of my heart 💝</span></label><div class="adthx" id="adthx"></div></div>`;
  document.body.append(ad);
  const chk=$('#adc');
  chk.onchange=async()=>{const ok=await setKind(chk.checked?'yes':'no');if(!ok)chk.checked=!chk.checked;else $('#adthx').textContent=chk.checked?'Thank you! 💝':''};
  ad.querySelector('.adx').onclick=async()=>{if(me.kindness==null)await setKind('no');ad.remove()};
}
function kindHTML(list){
  const g=v=>list.filter(p=>(p.kindness||null)===v).map(p=>esc(p.name));
  const row=(l,a)=>`<p style="margin:4px 0"><b>${l} (${a.length})</b>${a.length?'<br>'+a.join(', '):''}</p>`;
  return `<h3 style="margin:14px 0 4px">💝 Mochi &amp; Venus gifts</h3>${row('Yes 💝',g('yes'))}${row('Passed 🙅',g('no'))}${row('Not answered ⏳',g(null))}<p class="meta" style="margin:4px 0 0">Updates live while this page is open.</p>`;
}
function toast(msg){
  let w=$('.toasts');if(!w){w=document.createElement('div');w.className='toasts';document.body.append(w)}
  const t=document.createElement('div');t.className='toast';t.textContent=msg;w.append(t);setTimeout(()=>t.remove(),8000);
}
let unsub=null,known=null;
function watchKind(){
  if(unsub||!me.admin)return;
  unsub=onSnapshot(collection(db,'people'),snap=>{
    const list=snap.docs.map(d=>({code:d.id,...d.data()}));
    if(known)list.forEach(p=>{if(p.code!==me.code&&p.kindness&&p.kindness!==known[p.code])
      toast(p.kindness==='yes'?`💝 ${p.name} will gift Mochi & Venus!`:`🙅 ${p.name} passed on gifting Mochi & Venus.`)});
    known=Object.fromEntries(list.map(p=>[p.code,p.kindness||null]));
    people=list;const k=$('#kind');if(k)k.innerHTML=kindHTML(list);
  },()=>{});
}

function resetDraw(b,list){
  b.update(doc(db,'event','main'),{drawn:false,revealed:false});
  list.forEach(x=>{b.update(doc(db,'people',x.code),{giveTo:null,bought:false});b.set(doc(db,'chats',x.code),{items:[]})});
}

async function adminPanel(){
  const snap=await getDocs(collection(db,'people'));
  people=snap.docs.map(d=>({code:d.id,...d.data()}));const pl=people.slice();
  const base=location.href.split('#')[0],done=people.filter(p=>p.done).length;
  const st=p=>(p.done&&!p.claimed)?'Login reset, waiting for them':p.done?'✓ Wishlist done':p.claimed?'Joined':'Not joined yet';
  const el=$('#content');
  el.innerHTML=`<div class="card"><h3>Organizer panel</h3>
  <p class="meta">Share the site link. Everyone picks their name to get their own code. You can't see anyone's code here. ${done}/${people.length} finished their wishlist.${ev.drawn?` ${people.filter(p=>p.bought).length}/${people.length} have bought their gifts.`:''}</p>
  <button class="sm alt" id="link">🔗 Copy site link</button>
  <div style="margin-top:8px">${people.map((p,i)=>`<div class="item"><span>${esc(p.name)}<br><span class="meta">${st(p)}</span></span>${p.admin?'':`<span style="display:flex;gap:6px;flex-shrink:0">${p.claimed?`<button class="sm alt" data-rl="${i}">🔄 Reset login</button>`:''}<button class="sm alt" data-rm="${i}">🗑️ Remove</button></span>`}</div>`).join('')}</div>
  <div id="kind">${kindHTML(people)}</div>
  <label class="f">Add a person</label><div style="display:flex;gap:8px"><input type="text" id="newp" placeholder="Name"><button class="sm" id="addp">➕ Add</button></div>
  <label class="f">Extra pairs that can't match (optional, one per line, e.g. Mom - Dad)</label><textarea id="ex" style="min-height:60px"></textarea>
  ${ev.drawn?`<button class="alt" id="rev">${ev.revealed?'🙈 Hide the reveal':'🎉 Reveal Santas now'}</button>`:''}
  <button id="draw">${ev.drawn?'🎲 Redraw names':'🎲 Draw names'}</button><div class="err" id="aerr"></div></div>`;
  $('#link').onclick=async()=>{const b=$('#link');
    try{await navigator.clipboard.writeText(`🎁 ${ev.title}: open ${base} and pick your name to join`);b.textContent='✅ Copied!'}catch(e){prompt('Copy this link:',base)}
    setTimeout(()=>b.textContent='🔗 Copy site link',1500)};
  el.querySelectorAll('[data-rl]').forEach(x=>x.onclick=()=>resetLogin(pl[+x.dataset.rl]));
  el.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>removePerson(pl[+x.dataset.rm]));
  $('#addp').onclick=addPerson;
  const rv=$('#rev');if(rv)rv.onclick=async()=>{if(!ev.revealed&&!confirm('Reveal everyone\'s Secret Santa now?'))return;
    try{const b=writeBatch(db);b.update(doc(db,'event','main'),{revealed:!ev.revealed});await b.commit();home('org')}catch(e){$('#aerr').textContent='Could not update. Try again.'}};
  $('#draw').onclick=draw;
}

async function resetLogin(p){
  if(!confirm(`Reset ${p.name}'s login? Their name unlocks so they can pick it on the site and get their code back. Their wishlist and match stay as they are. Only do this when they are ready to pick their name right away.`))return;
  try{const b=writeBatch(db);b.update(doc(db,'people',p.code),{claimed:false});await b.commit();home('org')}
  catch(e){$('#aerr').textContent='Could not reset. Try again.'}
}

async function removePerson(p){
  if(!confirm(`Remove ${p.name}?`+(ev.drawn?' The draw will be reset and you will need to redraw.':'')))return;
  try{const b=writeBatch(db);b.delete(doc(db,'people',p.code));
    if(ev.drawn)resetDraw(b,people.filter(x=>x.code!==p.code));
    await b.commit();home('org')}
  catch(e){$('#aerr').textContent='Could not remove. Try again.'}
}

async function addPerson(){
  const n=$('#newp').value.trim();if(!n)return;
  if(people.some(p=>p.name.toLowerCase()===n.toLowerCase())){$('#aerr').textContent='That name is already on the list.';return}
  if(ev.drawn&&!confirm('Adding someone resets the draw, so you will need to redraw. Continue?'))return;
  const used=new Set(people.map(p=>p.code));let c;do{c=mkcode()}while(used.has(c));
  try{const b=writeBatch(db);b.set(doc(db,'people',c),{name:n,admin:false,claimed:false,done:false,bought:false,kindness:null,answers:null,codename:null,giveTo:null});
    if(ev.drawn)resetDraw(b,people);
    await b.commit();home('org')}
  catch(e){$('#aerr').textContent='Could not add. Try again.'}
}

async function draw(){
  if(ev.drawn&&!confirm('Redraw everyone\'s match? Current matches and messages will be replaced.'))return;
  if(people.length<3){$('#aerr').textContent='Need at least 3 people.';return}
  const bad=new Set();
  COUPLES.forEach(c=>{if(c.length===2)bad.add(pairKey(c[0],c[1]))});
  $('#ex').value.split('\n').forEach(l=>{const p=l.split(/\s*[-–]\s*/).map(s=>s.trim()).filter(Boolean);if(p.length===2)bad.add(pairKey(p[0],p[1]))});
  const ids=people.map(p=>p.code),nm=Object.fromEntries(people.map(p=>[p.code,p.name]));
  let pick=null;
  for(let t=0;t<5000&&!pick;t++){const r=shuffle(ids);
    if(ids.every((c,i)=>c!==r[i]&&!bad.has(pairKey(nm[c],nm[r[i]]))))pick=r}
  if(!pick){$('#aerr').textContent="Couldn't find a valid draw with those rules. Try fewer exclusions.";return}
  try{const b=writeBatch(db);
    ids.forEach((c,i)=>{b.update(doc(db,'people',c),{giveTo:pick[i],bought:false});b.set(doc(db,'chats',c),{items:[]})});
    b.update(doc(db,'event','main'),{drawn:true,revealed:false});await b.commit();home()}
  catch(e){$('#aerr').textContent='Could not save the draw. Try again.'}
}

boot();
